<!DOCTYPE html>
<html lang="en">
<head>
    <script>
  if (localStorage.getItem('userRole') !== 'hod') {
    window.location.href = '/login.html';
  }
</script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOD Dashboard - BIRT Attendance</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef2f5; margin: 20px; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
    th { background: #343a40; color: white; }
    .export-btn { background: #17a2b8; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🏛️ HOD Attendance Monitoring Portal</h2>
    <p>Overall Real-Time Live Records</p>
    <button class="export-btn" onclick="exportToCSV()">📥 Download Attendance Report (CSV)</button>
  </div>

  <div class="card">
    <h3>📊 Department Attendance Summary</h3>
    <table>
      <thead>
        <tr>
          <th>Roll Number</th>
          <th>Date & Time</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="hodTable">
        <tr><td colspan="3">Loading records...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    let attendanceData = [];

    async function fetchHODRecords() {
      try {
        const res = await fetch('/api/attendance/list');
        attendanceData = await res.json();
        const tbody = document.getElementById('hodTable');
        tbody.innerHTML = '';

        if (attendanceData.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3">No attendance records found.</td></tr>';
          return;
        }

        attendanceData.forEach(item => {
          tbody.innerHTML += `<tr>
            <td><b>${item.studentId}</b></td>
            <td>${new Date(item.timestamp).toLocaleString()}</td>
            <td><span style="color:green;font-weight:bold;">${item.status}</span></td>
          </tr>`;
        });
      } catch (err) {
        console.error("Error fetching data:", err);
      }
    }

    function exportToCSV() {
      if (attendanceData.length === 0) return alert("No data to export!");
      let csvContent = "data:text/csv;charset=utf-8,Roll Number,Date & Time,Status\n";
      
      attendanceData.forEach(row => {
        csvContent += `${row.studentId},${new Date(row.timestamp).toLocaleString()},${row.status}\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `Attendance_Report_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Auto Refresh har 5 second me
    fetchHODRecords();
    setInterval(fetchHODRecords, 5000);
  </script>
</body>
</html>
