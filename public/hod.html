<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOD Master Portal</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #1a202c; color: #edf2f7; margin: 0; padding: 20px; }
    .container { max-width: 1100px; margin: auto; }
    .header { display: flex; justify-content: space-between; align-items: center; background: #2d3748; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; }
    .card { background: #2d3748; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
    input, select { padding: 10px; border-radius: 5px; border: 1px solid #4a5568; background: #1a202c; color: white; }
    button { padding: 10px 15px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .btn-export { background: #3182ce; color: white; }
    .btn-logout { background: #e53e3e; color: white; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #1a202c; }
    th, td { border: 1px solid #4a5568; padding: 10px; text-align: left; }
    th { background: #2b6cb0; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>👑 HOD Master Attendance Portal</h2>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>

  <div class="card">
    <div style="display:flex; gap:15px; align-items:center; flex-wrap:wrap;">
      <div>
        <label>Filter Branch:</label>
        <select id="filterBranch" onchange="fetchRecords()">
          <option value="ALL">All Branches</option>
          <option value="Computer Science">Computer Science</option>
          <option value="AIML">AIML</option>
          <option value="EC">EC</option>
          <option value="EX">EX</option>
          <option value="Mechanical">Mechanical</option>
          <option value="CIVIL">CIVIL</option>
        </select>
      </div>

      <div>
        <label>Filter Date:</label>
        <input type="date" id="filterDate" onchange="fetchRecords()">
      </div>

      <button class="btn-export" onclick="exportHOD()">📥 Export Overall CSV</button>
    </div>

    <p style="margin-top:15px;">Total Records Found: <b id="totalCount">0</b></p>

    <div id="hodRecords"></div>
  </div>
</div>

<script>
  const user = JSON.parse(localStorage.getItem('user'));
  if (!user || user.role !== 'HOD') window.location.href = '/login.html';

  document.getElementById('filterDate').value = new Date().toISOString().split('T')[0];

  function logout() {
    localStorage.removeItem('user');
    window.location.href = '/login.html';
  }

  async function fetchRecords() {
    const branch = document.getElementById('filterBranch').value;
    const dateStr = document.getElementById('filterDate').value;

    const res = await fetch(`/api/attendance/query?role=HOD&branch=${branch}&dateStr=${dateStr}`);
    const data = await res.json();

    document.getElementById('totalCount').innerText = data.records ? data.records.length : 0;

    let html = `<table><thead><tr><th>#</th><th>Roll No</th><th>Branch</th><th>Subject</th><th>Mode</th><th>Time</th></tr></thead><tbody>`;
    if (data.records && data.records.length > 0) {
      data.records.forEach((r, idx) => {
        const time = new Date(r.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        html += `<tr><td>${idx+1}</td><td><b>${r.studentId}</b></td><td>${r.branch}</td><td>${r.subject}</td><td>${r.mode}</td><td>${time}</td></tr>`;
      });
    } else {
      html += `<tr><td colspan="6" style="text-align:center;">No records found.</td></tr>`;
    }
    html += `</tbody></table>`;
    document.getElementById('hodRecords').innerHTML = html;
  }

  function exportHOD() {
    const branch = document.getElementById('filterBranch').value;
    const dateStr = document.getElementById('filterDate').value;
    window.location.href = `/api/attendance/export-sheet?role=HOD&branch=${branch}&dateStr=${dateStr}`;
  }

  fetchRecords();
</script>

</body>
</html>
