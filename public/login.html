<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Login - Attendance Portal</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; }
    .login-box { background: white; padding: 35px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 400px; text-align: center; }
    h2 { margin-bottom: 20px; color: #1e3c72; font-size: 24px; }
    input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
    button { width: 100%; padding: 12px; background: #1e3c72; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:hover { background: #2a5298; }
    .error { color: #d32f2f; margin-top: 10px; font-weight: bold; font-size: 14px; }
  </style>
</head>
<body>

<div class="login-box">
  <h2>🎓 Faculty & HOD Login</h2>
  <input type="text" id="userId" placeholder="User ID (e.g. teacher_java or hod_cs)">
  <input type="password" id="password" placeholder="Password (e.g. 123)">
  <button onclick="login()">Login to Dashboard</button>
  <p id="errMsg" class="error"></p>
</div>

<script>
  async function login() {
    const userId = document.getElementById('userId').value.trim();
    const password = document.getElementById('password').value.trim();
    const msg = document.getElementById('errMsg');

    if (!userId || !password) {
      msg.innerText = "Please enter both User ID and Password!";
      return;
    }

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ userId, password })
      });
      const data = await res.json();

      if (data.success) {
        localStorage.setItem('user', JSON.stringify(data.user));
        if (data.user.role === 'HOD') {
          window.location.href = '/hod.html';
        } else {
          window.location.href = '/teacher.html';
        }
      } else {
        msg.innerText = data.message;
      }
    } catch(e) {
      msg.innerText = "Connection error. Please try again.";
    }
  }
</script>

</body>
</html>
