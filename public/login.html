<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Login & Registration</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; padding: 15px; }
    .box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 420px; }
    h2 { text-align: center; margin-bottom: 20px; color: #1e3c72; margin-top: 0; }
    input, select { width: 100%; padding: 11px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    button { width: 100%; padding: 12px; background: #1e3c72; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:hover { background: #2a5298; }
    .toggle { text-align: center; margin-top: 15px; color: #0288d1; cursor: pointer; font-weight: bold; font-size: 14px; }
    .msg { text-align: center; margin-top: 10px; font-weight: bold; font-size: 14px; }
  </style>
</head>
<body>

<div class="box">
  <!-- LOGIN FORM -->
  <div id="loginSection">
    <h2>🎓 Faculty & HOD Login</h2>
    <input type="text" id="loginUser" placeholder="User ID">
    <input type="password" id="loginPass" placeholder="Password">
    <button onclick="login()">Login to Dashboard</button>
    <div class="toggle" onclick="toggleView(true)">New Teacher? Register Here</div>
  </div>

  <!-- REGISTER FORM -->
  <div id="registerSection" style="display:none;">
    <h2>📝 New Teacher Registration</h2>
    <input type="text" id="regName" placeholder="Full Name (e.g. Prof. Verma)">
    <input type="text" id="regUser" placeholder="Choose Unique User ID">
    <input type="password" id="regPass" placeholder="Choose Password">
    
    <select id="regBranch">
      <option value="Computer Science">Computer Science</option>
      <option value="AIML">AIML</option>
      <option value="EC">EC</option>
      <option value="EX">EX</option>
      <option value="Mechanical">Mechanical</option>
      <option value="CIVIL">CIVIL</option>
    </select>

    <input type="text" id="regSubjects" placeholder="Subjects (Comma separated, e.g. Java, DBMS)">

    <button onclick="register()" style="background:#27ae60;">Create My Private Account</button>
    <div class="toggle" onclick="toggleView(false)">Already Have Account? Login</div>
  </div>

  <p id="statusMsg" class="msg"></p>
</div>

<script>
  function toggleView(showReg) {
    document.getElementById('loginSection').style.display = showReg ? 'none' : 'block';
    document.getElementById('registerSection').style.display = showReg ? 'block' : 'none';
    document.getElementById('statusMsg').innerText = '';
  }

  async function login() {
    const userId = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value.trim();
    const msg = document.getElementById('statusMsg');

    if(!userId || !password) { msg.style.color='red'; msg.innerText="Fill all fields!"; return; }

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ userId, password })
      });
      const data = await res.json();

      if(data.success) {
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = data.user.role === 'HOD' ? '/hod.html' : '/teacher.html';
      } else {
        msg.style.color='red'; msg.innerText = data.message;
      }
    } catch(e) {
      msg.style.color='red'; msg.innerText = "Connection error!";
    }
  }

  async function register() {
    const name = document.getElementById('regName').value.trim();
    const userId = document.getElementById('regUser').value.trim();
    const password = document.getElementById('regPass').value.trim();
    const branch = document.getElementById('regBranch').value;
    const subjects = document.getElementById('regSubjects').value.trim();
    const msg = document.getElementById('statusMsg');

    if(!name || !userId || !password) { msg.style.color='red'; msg.innerText="Fill required details!"; return; }

    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ name, userId, password, branch, subjects })
      });
      const data = await res.json();
      msg.style.color = data.success ? 'green' : 'red';
      msg.innerText = data.message;

      if(data.success) {
        setTimeout(() => toggleView(false), 1500);
      }
    } catch(e) {
      msg.style.color='red'; msg.innerText = "Error registering teacher.";
    }
  }
</script>

</body>
</html>
