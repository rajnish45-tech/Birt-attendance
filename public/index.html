<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIRT Attendance Portal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      width: 320px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      box-sizing: border-box;
    }
    .btn-student { background: #16a34a; color: white; }
    .btn-staff { background: #2563eb; color: white; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🎓 BIRT Attendance System</h2>
    <p>Semester 5 Portal</p>
    <a href="/student.html" class="btn btn-student">🧑‍🎓 Student Portal</a>
    <a href="/login.html" class="btn btn-staff">🔒 Teacher / HOD Login</a>
  </div>

</body>
</html>
