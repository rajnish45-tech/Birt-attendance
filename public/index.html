<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Attendance - Smart Attendance System</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #f0f4f8; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 420px; }
    h2 { margin-top: 0; color: #333; text-align: center; }
    label { font-weight: bold; font-size: 13px; margin-bottom: 5px; display: block; color: #444; }
    input, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    input[readonly] { background-color: #e9ecef; color: #495057; font-weight: bold; cursor: not-allowed; }
    button { background: #2e7d32; color: white; border: none; width: 100%; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; margin-bottom: 8px; }
    button:hover { background: #1b5e20; }
    .report-btn { background: #0288d1; }
    .report-btn:hover { background: #01579b; }
    #statusMsg { text-align: center; margin-top: 15px; font-weight: bold; font-size: 14px; }
    
    /* Login Link placed nicely near top */
    .top-login-link { text-align: right; margin-bottom: 15px; font-size: 13px; }
    .top-login-link a { color: #d97706; text-decoration: none; font-weight: bold; }
    .top-login-link a:hover { text-decoration: underline; }
    
    /* ERP Report Table Styles */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; text-align: center; }
    th, td { border: 1px solid #ddd; padding: 6px; }
    th { background-color: #0288d1; color: white; }
  </style>
</head>
<body>

<div class="card">
  <h2>🎓 Student Attendance</h2>

  <!-- Teacher / HOD Login Link shifted to top for easy access -->
  <div class="top-login-link">
    <a href="/login.html">🔒 Teacher / HOD Login</a>
  </div>
  
  <label>Branch:</label>
  <select id="branchSelect">
    <option value="Computer Science">Computer Science</option>
    <option value="Information Technology">Information Technology</option>
    <option value="Electronics">Electronics</option>
    <option value="Mechanical">Mechanical</option>
    <option value="Civil">Civil</option>
  </select>

  <label>Subject Name:</label>
  <input type="text" id="subjectSelect" placeholder="e.g. Java, DBMS">

  <label>Roll Number (Locked after first entry):</label>
  <input type="text" id="studentId" placeholder="e.g. 0173CS251106">

  <label>4-Digit Passcode:</label>
  <input type="number" id="passcode" placeholder="Enter teacher's session code">

  <button onclick="markAttendance()">📍 Mark Attendance (GPS)</button>
  <button class="report-btn" onclick="loadMyReport()">📊 View My ERP Attendance Report</button>
  
  <p id="statusMsg"></p>

  <!-- ERP Report Section -->
  <div id="erpReportSection" style="margin-top: 15px; display: none;">
    <hr>
    <h4 style="margin: 5px 0; color: #1b5e20; text-align:center;">Overall Attendance Status</h4>
    <div id="overallStats" style="font-size: 13px; text-align:center; font-weight:bold;"></div>
    
    <h4 style="margin: 10px 0 5px 0; font-size:13px; text-align:left;">Subject-wise Records</h4>
    <table>
      <thead>
        <tr>
          <th>Subject</th>
          <th>Held</th>
          <th>Present</th>
          <th>Absent</th>
          <th>%</th>
        </tr>
      </thead>
      <tbody id="studentReportBody"></tbody>
    </table>
  </div>
</div>

<script>
  window.onload = function() {
    const savedRoll = localStorage.getItem('studentRoll');
    const rollInput = document.getElementById('studentId');
    if (savedRoll) {
      rollInput.value = savedRoll;
      rollInput.readOnly = true; 
    }
  };

  async function markAttendance() {
    let studentId = document.getElementById('studentId').value.trim();
    const enteredCode = document.getElementById('passcode').value.trim();
    const branch = document.getElementById('branchSelect').value;
    const subject = document.getElementById('subjectSelect').value.trim();
    const msg = document.getElementById('statusMsg');

    if (!studentId || !enteredCode || !subject) {
      alert("Kripya Roll Number, Subject aur Passcode sabhi fields bharein!");
      return;
    }

    localStorage.setItem('studentRoll', studentId);
    document.getElementById('studentId').readOnly = true;

    if (!navigator.geolocation) {
      alert("Aapka browser Geolocation support nahi karta!");
      return;
    }

    msg.style.color = '#333';
    msg.innerText = "Location fetch ho rahi hai, kripya wait karein...";

    navigator.geolocation.getCurrentPosition(async (pos) => {
      const userLat = pos.coords.latitude;
      const userLng = pos.coords.longitude;
      
      let deviceId = localStorage.getItem('deviceId');
      if (!deviceId) {
        deviceId = 'dev_' + Math.random().toString(36).substring(2) + Date.now();
        localStorage.setItem('deviceId', deviceId);
      }

      try {
        const res = await fetch('/api/attendance/mark', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ branch, subject, studentId, enteredCode, userLat, userLng, deviceId })
        });
        const data = await res.json();
        msg.style.color = data.success ? 'green' : 'red';
        msg.innerText = data.message;
      } catch (e) {
        msg.style.color = 'red';
        msg.innerText = "Server connection error!";
      }
    }, (err) => {
      alert("Location error: GPS on karein aur browser ko location permission dein! (" + err.message + ")");
      msg.style.color = 'red';
      msg.innerText = "GPS Location Failed.";
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  }

  async function loadMyReport() {
    let studentId = document.getElementById('studentId').value.trim();
    const msg = document.getElementById('statusMsg');

    if (!studentId) {
      alert("Pehle Roll Number enter karein!");
      return;
    }

    localStorage.setItem('studentRoll', studentId);
    document.getElementById('studentId').readOnly = true;

    msg.style.color = '#0288d1';
    msg.innerText = "Loading your ERP attendance report...";

    try {
      const res = await fetch(`/api/attendance/student-report/${studentId}`);
      const data = await res.json();

      if (!data.success) {
        msg.style.color = 'red';
        msg.innerText = "Report load karne mein error aayi.";
        return;
      }

      document.getElementById('overallStats').innerHTML = `
        Total Classes Held: ${data.grandTotalHeld} | Present: ${data.grandTotalPresent} | Absent: ${data.grandTotalAbsent}<br>
        <span style="color:#2e7d32; font-size:15px;">Overall Percentage: ${data.overallPercentage}%</span>
      `;

      let rows = '';
      for (let sub in data.subjectWise) {
        let item = data.subjectWise[sub];
        let pct = item.totalHeld > 0 ? ((item.present / item.totalHeld) * 100).toFixed(2) : 0;
        rows += `
          <tr>
            <td style="text-align:left;"><b>${sub}</b></td>
            <td>${item.totalHeld}</td>
            <td style="color:green; font-weight:bold;">${item.present}</td>
            <td style="color:red; font-weight:bold;">${item.absent}</td>
            <td><b>${pct}%</b></td>
          </tr>
        `;
      }

      document.getElementById('studentReportBody').innerHTML = rows;
      document.getElementById('erpReportSection').style.display = 'block';
      msg.style.color = 'green';
      msg.innerText = "📊 ERP Report Loaded Successfully!";
    } catch (e) {
      msg.style.color = 'red';
      msg.innerText = "Server connection error while loading report!";
    }
  }
</script>

</body>
</html>
