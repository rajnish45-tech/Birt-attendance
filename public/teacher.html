<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Panel - BIRT Attendance</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    button { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-right: 10px; }
    .btn-start { background-color: #28a745; color: white; }
    .btn-clear { background-color: #dc3545; color: white; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #007bff; color: white; }
    .total-summary { margin-top: 15px; padding: 12px; background-color: #e9ecef; border-radius: 5px; font-weight: bold; font-size: 1.1em; color: #333; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🎓 Teacher Panel (Semester 5)</h2>
    <button class="btn-start" onclick="startClass()">📍 Start Attendance Session</button>
    <button class="btn-clear" onclick="clearData()">🗑️ Clear Session Attendance Data</button>
    <p id="statusMsg" style="margin-top: 10px; font-weight: bold; color: green;"></p>
  </div>

  <div class="card">
    <h3>📋 Semester 5 Attendance Records</h3>
    <table>
      <thead>
        <tr>
          <th>Student ID / Roll No</th>
          <th>Semester</th>
          <th>Session Slot</th>
          <th>Time Stamp</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="attendanceTable">
        <!-- Records will load dynamically -->
      </tbody>
    </table>

    <!-- Total Students Count Summary -->
    <div class="total-summary" id="totalCountBox">
      📊 Total Present Students: <span id="studentCount">0</span>
    </div>
  </div>

  <script>
    // Page load hote hi HOD style me attendance fetch karein
    document.addEventListener('DOMContentLoaded', fetchAttendance);

    async function fetchAttendance() {
      try {
        // Multi-route fallback: pehle /api/attendance try karo, agar error aaye toh /api/attendance/all
        let res = await fetch('/api/attendance');
        if (!res.ok) {
          res = await fetch('/api/attendance/all');
        }
        
        const records = await res.json();
        const tbody = document.getElementById('attendanceTable');
        const studentCountEl = document.getElementById('studentCount');
        
        tbody.innerHTML = '';

        if (!records || !Array.isArray(records) || records.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Koi attendance record nahi mila.</td></tr>';
          studentCountEl.innerText = '0';
          return;
        }

        records.forEach(item => {
          const tr = document.createElement('tr');
          
          // Flexible key fallback (Roll No / Student ID / Name)
          const id = item.studentId || item.rollNo || item.rollNumber || item.name || 'N/A';
          const sem = item.semester || item.sem || 'Semester 5';
          const slot = item.sessionSlot || item.slot || 'Morning';
          const time = item.timestamp ? new Date(item.timestamp).toLocaleTimeString() : (item.time || 'N/A');
          const status = item.status || 'Present';

          tr.innerHTML = `
            <td>${id}</td>
            <td>${sem}</td>
            <td>${slot}</td>
            <td>${time}</td>
            <td style="color: green; font-weight: bold;">${status}</td>
          `;
          tbody.appendChild(tr);
        });

        // Total count update
        studentCountEl.innerText = records.length;
      } catch (err) {
        console.error("Error fetching attendance:", err);
      }
    }

    // Start Session Logic
    async function startClass() {
      try {
        const statusMsg = document.getElementById('statusMsg');
        statusMsg.innerText = "Activating session & capturing location...";
        
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(async (position) => {
            const teacherLat = position.coords.latitude;
            const teacherLng = position.coords.longitude;

            const res = await fetch('/api/session/start', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                lat: teacherLat,
                lng: teacherLng,
                semester: 'Semester 5'
              })
            });

            const data = await res.json();
            alert(data.message || "Attendance Session Started Successfully!");
            statusMsg.innerText = "🟢 Attendance window is OPEN!";
            fetchAttendance(); // Session start hone par table refresh karein
          }, (err) => {
            alert("Location access denied or error: " + err.message);
            statusMsg.innerText = "❌ Location required to start session.";
          });
        } else {
          alert("Geolocation is not supported by this browser.");
        }
      } catch (err) {
        alert("Error starting session: " + err.message);
      }
    }

    // Clear Data Logic
    async function clearData() {
      if (confirm("Kya aap sure hain ki aap current session ka attendance data delete karna chahte hain?")) {
        try {
          const res = await fetch('/api/attendance/clear-all', { method: 'DELETE' });
          const data = await res.json();
          alert(data.message);
          fetchAttendance(); // Reload table data immediately
        } catch (err) {
          alert("Error: " + err.message);
        }
      }
    }
  </script>
</body>
</html>
