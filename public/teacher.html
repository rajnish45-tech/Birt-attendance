<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Panel - BIRT Attendance</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    button { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .btn-start { background-color: #28a745; color: white; margin-right: 10px; }
    .btn-clear { background-color: #dc3545; color: white; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #007bff; color: white; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🎓 Teacher Panel (Semester 5)</h2>
    <button class="btn-start" onclick="startClass()">📍 Start Attendance Session</button>
    <button class="btn-clear" onclick="clearData()">🗑️ Clear Session Attendance Data</button>
    <p id="statusMsg" style="margin-top: 10px; font-weight: bold;"></p>
  </div>

  <div class="card">
    <h3>📋 Semester 5 Attendance Records</h3>
    <table>
      <thead>
        <tr>
          <th>Student ID</th>
          <th>Semester</th>
          <th>Session Slot</th>
          <th>Time Stamp</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="attendanceTable">
        <!-- Records will load dynamically -->
      </tbody>
    </table>
  </div>

  <script>
    async function clearData() {
      if (confirm("Kya aap sure hain ki aap current session ka attendance data delete karna chahte hain?")) {
        try {
          const res = await fetch('/api/attendance/clear-all', { method: 'DELETE' });
          const data = await res.json();
          alert(data.message);
          location.reload();
        } catch (err) {
          alert("Error: " + err.message);
        }
      }
    }
  </script>
  <script src="script.js"></script>
</body>
</html>
